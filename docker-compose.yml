services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vinseo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vinseo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: &backend
      context: ./backend
      dockerfile: Dockerfile
    image: vinseo-backend:local
    command:
      [
        "sh",
        "-c",
        "node dist/database/migrate-cli.js && node dist/database/seed-cli.js",
      ]
    environment: &app-env
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vinseo
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend
    image: vinseo-backend:local
    command: ["node", "dist/main.js"]
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build: *backend
    image: vinseo-backend:local
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
    depends_on:
      init:
        condition: service_completed_successfully

  demo:
    profiles: ["demo"]
    build: *backend
    image: vinseo-backend:local
    command: ["node", "dist/demo/demo-cli.js"]
    environment:
      API_BASE_URL: http://api:3000
      ARTIFACTS_DIR: /artifacts
      DEMO_TIMEOUT_MS: "60000"
      DEMO_UID: "${UID:-1000}"
      DEMO_GID: "${GID:-1000}"
    # Docker creates a missing bind mount as root. The CLI claims it, then drops to DEMO_UID.
    user: "0:0"
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
